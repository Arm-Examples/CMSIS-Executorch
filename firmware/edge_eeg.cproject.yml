#
# Edge_Deploy firmware: UART EEG stream in -> per-sample preprocessing on the
# Cortex-M55 -> TinyEEGNet int8 on the Ethos-U85 -> IMU motion gate -> LED and
# JSON line out (src/main.cpp). The AI layer (ai_layer/, generated by
# create_ai_layer.py) brings the ExecuTorch runtime, the operator components and
# the model; the Board layer brings the board bring-up and the UART.
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS

  define:
    # NPU cycle counts from the Ethos-U PMU (src/infer.cpp) on both targets.
    - ARM_MODEL_USE_PMU_COUNTERS

  add-path:
    - ./src
    - ./tests/generated

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
        - -ffp-contract=off
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./src/main.cpp
        - file: ./src/app.cpp
        - file: ./src/app.h
        - file: ./src/clock.cpp
        - file: ./src/clock.h
        - file: ./src/infer.cpp
        - file: ./src/infer.h
        - file: ./src/imu.cpp
        - file: ./src/imu.h
        - file: ./src/motion_gate.cpp
        - file: ./src/motion_config.h
        - file: ./src/leds.cpp
        - file: ./src/leds.h
        - file: ./src/json_out.cpp
        - file: ./src/json_out.h
        - file: ./src/preprocess.cpp
          # Bit-exact with host/pipeline_ref.py: full IEEE mode (armclang's default
          # -ffp-mode=std flushes denormals); FMA contraction is off in the source.
          misc:
            - for-compiler: AC6
              CPP:
                - -ffp-mode=full
        - file: ./src/preprocess.h
        - file: ./src/params_gen.h
        - file: ./src/uart_rx.cpp
        - file: ./src/uart_rx.h
        # Built-in self-test; active with -DSELFTEST (build-type SelfTest).
        - file: ./src/selftest.cpp
        - file: ./src/selftest.h
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading, so it builds for bare metal (BSD-3-Clause, see
        # src/LICENSE-ExecuTorch).
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
