name: Build and test Ethos-U55-128

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Corstone-300 / Ethos-U55-128 (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain: [AC6, GCC, CLANG]

    steps:
      - uses: actions/checkout@v7

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: vcpkg-configuration.json
          cache: cmsis-executorch

      # The default Arm license setup is for evaluation only.
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache CMSIS packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-u55-${{ hashFiles('*.csolution.yml', 'board/Corstone-300/*.clayer.yml') }}
          path: /home/runner/.cache/arm/packs

      - name: Cache model-export environment
        uses: actions/cache@v6
        with:
          key: model-export-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'setup_venv.py') }}
          path: .venv

      - name: Create model-export environment
        run: ./setup_venv.sh

      - name: Generate U55 MLOps information
        run: cbuild setup cmsis-executorch-u55.csolution.yml --active SSE-300-U55 --packs

      - name: Create U55 AI layer
        run: .venv/bin/python create_ai_layer.py cmsis-executorch-u55.cbuild-mlops.yml

      - name: Build SSE-300-U55
        run: cbuild cmsis-executorch-u55.csolution.yml --active SSE-300-U55 --packs --toolchain ${{ matrix.toolchain }}

      - name: Run SSE-300-U55 on FVP simulation
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: |
          set -o pipefail
          FVP_Corstone_SSE-300_Ethos-U55 \
            -f board/Corstone-300/fvp_config_u55.txt \
            -a out/*/SSE-300-U55/*/*.hex \
            --simlimit 120 2>&1 | tee fvp.log

      - name: Check application result
        run: 'grep -Fq "Test_result: PASS" fvp.log'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cmsis-executorch-SSE-300-U55-${{ matrix.toolchain }}
          path: |
            out
            ai_layer
            fvp.log
          if-no-files-found: warn
