layer:
  type: Board
  description: Board setup for AI/ML with Ethos U55
  for-board: ARM::V2M-MPS3-SSE-300-FVP
  for-device: ARM::SSE-300-MPS3

  connections:
    - connect: Corstone-300-U55
      provides:
        - CMSIS_USART
        - STDOUT
        - STDERR
        - Heap: 786432

  define:
    - CMSIS_target_header: \"Corstone-300.h\"
    - ETHOSU55
    - CORSTONE300_FVP
    - ARM_MODEL_USE_PMU_COUNTERS

  packs:
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::ethos-u-core-driver@^1.25.2
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0

  components:
    - component: CMSIS:CORE

    - component: CMSIS Driver:USART

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom

    - component: Device:Definition
    - component: Device:Startup&C Startup

    - component: Device:Native Driver:SysCounter
    - component: Device:Native Driver:SysTimer
    - component: Device:Native Driver:Timeout
    - component: Device:Native Driver:UART

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U55

  # AC6-specific linker flags
  misc:
    - for-compiler: AC6
      Link:
        - --diag_suppress=6312,6314,6329,6848

  groups:
    - group: Board
      files:
        - file: ./main.c
        - file: ./main.h
        - file: ./ethos_setup.c
        - file: ./retarget_stdio.c

    # Clang runtime stubs (std::chrono, std::random workarounds)
    - group: Clang Runtime Support
      for-compiler: CLANG
      add-path:
        - ../../src/include
      files:
        - file: ../../src/cxx_stubs.cpp

    # AC6 runtime stubs
    - group: AC6 Runtime Support
      for-compiler: AC6
      add-path:
        - ../../src/include
      files:
        - file: ../../src/cxx_stubs.cpp

  linker:
    - for-compiler: GCC
      script: ./Corstone-300_unified.ld
    - for-compiler: CLANG
      script: ./Corstone-300_unified.ld
    - for-compiler: AC6
      script: ./Corstone-300.sct
